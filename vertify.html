
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证与账户激活 - 蕊宫 (Rui Palace)</title>
    <style>
        /* 彻底重置样式，契合蕊宫温润暖色宣纸美学 */
        * {

            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f4efe6;
            color: #2c2a29;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 48px 40px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(44, 42, 41, 0.06);
            text-align: center;
            max-width: 440px;
            width: 90%;
            border: 1px solid #e6dec5;
        }
        h2 {
            margin-bottom: 16px;
            font-weight: 500;
            color: #1a1817;
            font-size: 22px;
            letter-spacing: 1px;
            line-height: 1.5;
        }
        p {
            color: #615b56;
            font-size: 14px;
            line-height: 1.8;
            margin: 16px 0;
        }
        .sub-text {
            font-size: 12px;
            color: #9e9589;
            margin-top: -6px;
            display: block;
        }
        .btn {
            display: inline-block;
            margin-top: 28px;
            background-color: #2c2a29;
            color: #f4efe6;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #4a4643;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="title">正在验证...<br><span style="font-size: 13px; font-weight: normal; color: #9e9589; letter-spacing: 0;">Verifying...</span></h2>
        <p id="message">请稍候，我们正在为您确认邮箱信息并激活账户。<br><span class="sub-text">Please wait while we verify your email and activate your account.</span></p>
        <a href="/" class="btn" id="homeBtn" style="display: none;">欢迎回到蕊宫 / Welcome back to Rui Palace</a>
    </div>

    <script>
        
window.addEventListener('DOMContentLoaded', async () => {
            const titleEl = document.getElementById('title');
            const messageEl = document.getElementById('message');
            const homeBtn = document.getElementById('homeBtn');

            try {
                // 1. 从 URL 参数中安全获取 token 和 email
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token');
                const email = params.get('email'); 

                // 🛡️ 增加前端防线：如果没有 token，直接拦截提示
                if (!token) {
                    titleEl.innerHTML = '验证链接无效<br><span style="font-size: 13px; font-weight: normal; color: #9e9589;">Invalid Verification Link</span>';
                    messageEl.innerHTML = '缺少必要的验证参数，请检查链接是否完整。<br><span class="sub-text">Missing necessary parameters.</span>';
                    homeBtn.style.display = 'inline-block';
                    return;
                }

                // 2. 向 Supabase 的 send-welcome-email 发送验证请求
                const response = await fetch("https://olkyevxkiwkmrhpnqbnq.supabase.co/functions/v1/send-welcome-email", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ 
                        token: token, 
                        email: email 
                    })
                });

                // 💡 关键补丁：必须在此处解析 JSON 响应体，防止报错崩坏
                const data = await response.json();

                // 3. 根据响应状态更新界面
                if (response.ok) {
                    titleEl.innerHTML = '验证成功<br><span style="font-size: 13px; font-weight: normal; color: #9e9589;">Verification Successful</span>';
                    messageEl.innerHTML = `邮箱 <strong>${email || '您的邮箱'}</strong> 已成功激活。<br>包含电子日记本访问链接的邮件已发送至您的收件箱，请注意查收。<br><br><span class="sub-text">Account activated. Access link has been sent to your inbox.</span>`;
                } else {
                    // 此时 data 变量已安全存在，可以正常读取后端返回的 error
                    titleEl.innerHTML = '验证失败或链接已失效<br><span style="font-size: 13px; font-weight: normal; color: #9e9589;">Verification Failed or Expired</span>';
                    messageEl.innerHTML = `${data.error || '该验证链接已被使用或已过期，请重新申请。'}<br><br><span class="sub-text">This link may have already been used or expired.</span>`;
                }
                homeBtn.style.display = 'inline-block';

            } catch (err) {
                console.error("激活异常: ", err);
                titleEl.innerHTML = '网络连接异常<br><span style="font-size: 13px; font-weight: normal; color: #9e9589;">Connection Error</span>';
                messageEl.innerHTML = '无法连接到服务器，请稍后再试。<br><span class="sub-text">Unable to connect to the server, please try again later.</span>';
                homeBtn.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
