
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证与账户激活 - 蕊宫 (Rui Palace)</title>
    <style>
        /* 彻底重置样式，契合蕊宫温润暖色宣纸美学 */
        * {

            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f4efe6;
            color: #2c2a29;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 48px 40px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(44, 42, 41, 0.06);
            text-align: center;
            max-width: 440px;
            width: 90%;
            border: 1px solid #e6dec5;
        }
        h2 {
            margin-bottom: 16px;
            font-weight: 500;
            color: #1a1817;
            font-size: 22px;
            letter-spacing: 1px;
            line-height: 1.5;
        }
        p {
            color: #615b56;
            font-size: 14px;
            line-height: 1.8;
            margin: 16px 0;
        }
        .sub-text {
            font-size: 12px;
            color: #9e9589;
            margin-top: -6px;
            display: block;
        }
        .btn {
            display: inline-block;
            margin-top: 28px;
            background-color: #2c2a29;
            color: #f4efe6;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #4a4643;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="title">正在验证...<br><span style="font-size: 13px; font-weight: normal; color: #9e9589; letter-spacing: 0;">Verifying...</span></h2>
        <p id="message">请稍候，我们正在为您确认邮箱信息并激活账户。<br><span class="sub-text">Please wait while we verify your email and activate your account.</span></p>
        <a href="/" class="btn" id="homeBtn" style="display: none;">欢迎回到蕊宫 / Welcome back to Rui Palace</a>
    </div>
        
<script>
        window.addEventListener('DOMContentLoaded', () => {
            const titleEl = document.getElementById('title');
            const messageEl = document.getElementById('message');
            const homeBtn = document.getElementById('homeBtn');

            const params = new URLSearchParams(window.location.search);
            const email = params.get('email'); 

            // 极简展示：因为后端已经帮我们把资格和邮件都处理好了，前端只负责展示成功并给入口
            titleEl.innerHTML = '邮箱验证成功！<br><span style="font-size: 13px; font-weight: normal; color: #9e9589;">Verification Successful</span>';
            messageEl.innerHTML = `邮箱 <strong>${email || '您的邮箱'}</strong> 已成功激活。<br>如果您在前 99 名限量名额内，包含电子日记本访问链接的邮件已发送至您的收件箱。<br><br><span class="sub-text">Your account is activated. Check your inbox for your journal access.</span>`;
            
            homeBtn.href = "/"; // 可以链回主页或直接链向日记本
            homeBtn.innerText = "返回蕊宫首页 / Return to Home";
            homeBtn.style.display = 'inline-block';
        });
    </script>
</body>
</html>
