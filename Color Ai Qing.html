<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艾青 · 仙草正气美学色卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Serif SC', serif; 
            background-color: #F8FAF9;
            /* 使用您提供的云纹背景 */
            background-image: url("https://i.imgur.com/your_cloud_pattern_link.png"); 
            background-attachment: fixed;
        }
        .chinese-border { border: 1px solid rgba(74, 103, 65, 0.15); outline: 3px double rgba(74, 103, 65, 0.08); outline-offset: -8px; background: rgba(255, 255, 255, 0.6); }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #4A6741; cursor: pointer; }
    </style>
</head>
<body class="text-neutral-800 min-h-screen flex flex-col justify-between">

<header class="w-full max-w-7xl mx-auto px-6 py-12 flex flex-col items-center text-center border-b border-neutral-200/50 relative">
    
    <div class="hidden lg:flex absolute left-8 top-1/2 -translate-y-1/2 items-center space-x-2">
        <span class="w-[1px] h-12 bg-neutral-300"></span>
        <span style="writing-mode: vertical-rl; text-orientation: upright;" class="text-[10px] text-neutral-500 tracking-[0.3em] font-light">蕊宫 · 艾青格物</span>
    </div>

    <h1 class="text-3xl md:text-4xl font-extrabold tracking-[0.3em] text-neutral-900 mb-4">艾青，凝露白</h1>
    <p class="text-xs text-neutral-400 tracking-[0.5em] uppercase font-light mb-4">Mugwort Green & Dewy White Spectrum</p>
    <p class="text-sm text-neutral-600 leading-relaxed tracking-widest font-light">
        “正气化青，温婉入药。”<br>
        于药田深处与晨露微凉之间，寻得一抹斩断寒邪、静守本真的草木风骨。
    </p>

    <div class="hidden lg:flex absolute right-8 top-1/2 -translate-y-1/2 items-center space-x-2">
        <span style="writing-mode: vertical-rl; text-orientation: upright;" class="text-[10px] text-neutral-500 tracking-[0.3em] font-light">仙草怀真 · 正气长存</span>
        <span class="w-[1px] h-12 bg-neutral-300"></span>
    </div>
</header>
    <main class="w-full max-w-7xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-2 gap-12">
        <section class="chinese-border p-8 rounded-2xl">
            <h2 class="text-md font-semibold tracking-[0.2em] mb-6 flex items-center">
                <span class="w-2.5 h-2.5 bg-[#4A6741] rounded-full mr-2"></span>西阁 · 艾青凝露色卡
            </h2>
            <div id="color-grid" class="grid grid-cols-2 gap-4"></div>
        </section>

        <section class="chinese-border p-8 rounded-2xl flex flex-col space-y-6">
            <h2 class="text-md font-semibold tracking-[0.2em]">东阁 · 听风听雨观象台</h2>
            <div class="aspect-video bg-neutral-200/50 rounded-lg overflow-hidden">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/fKbhu-kOhr8" allowfullscreen></iframe>
            </div>
            <a href="Color Sky Blue.html" class="flex items-center justify-between group p-3.5 border border-[#E05263]/20 hover:border-[#E05263]/50 bg-gradient-to-r from-white/10 to-[#E05263]/5 rounded-lg transition-all duration-300 cursor-pointer">
                <h4 class="text-[11px] font-semibold tracking-widest text-neutral-800">流转通道：云破奇峰涌帝青</h4>
            </a>
            
            <div id="dynamic-pad" onclick="copy(document.getElementById('dynamic-hex').innerText)" class="w-full h-24 rounded-xl flex flex-col justify-end p-4 text-white transition-colors duration-500 cursor-pointer hover:opacity-90 active:scale-[0.99]" style="background-color: #4A6741;">
                <p id="dynamic-name" class="text-xs font-bold tracking-[0.2em]">南阳艾绿</p>
                <div class="flex items-center space-x-2">
                    <p id="dynamic-hex" class="text-[10px] font-mono opacity-80">#4A6741</p>
                    <span class="text-[8px] border border-white/30 px-1 rounded uppercase">点击复制</span>
                </div>
            </div>
            <input type="range" id="color-slider" min="0" max="5" value="0" class="w-full h-1 bg-neutral-300 rounded-lg appearance-none cursor-pointer">
            
            <div class="border-t border-neutral-200 pt-4">
                <div id="poetry-container" class="text-sm tracking-widest text-neutral-600 mb-2">
                    <p id="poetry-text">“绿叶丛中藏仙草，清风徐来药韵长。”</p>
                    <p id="poetry-source" class="text-[10px] text-neutral-400 tracking-widest mt-2 text-right">——《采药人语》</p>
                </div>
                <button id="next-poetry" class="text-[10px] text-[#4A6741] hover:underline tracking-widest">换一首诗 ➔</button>
            </div>
        </section>
    </main>

    <script>
        const colors = [{hex:'#4A6741',name:'南阳艾绿'},{hex:'#6B8E60',name:'苍青草色'},{hex:'#8FA984',name:'晨露浅草'},{hex:'#B2C6A8',name:'薄青云雾'},{hex:'#D6E3CF',name:'初荷凝露'},{hex:'#F0F5EF',name:'凝露白'}];
        const poetries = [
            { text: "手持艾叶驱寒气，正气存内百邪除。", source: "—— 医家语" },
            { text: "绿叶丛中藏仙草，清风徐来药韵长。", source: "—— 采药人语" },
            { text: "晨露凝青如玉润，静守本真待岁长。", source: "—— 灵犀鉴" },
            { text: "万物静观皆自得，草木青青显正气。", source: "—— 程颢《秋日》" },
            { text: "愿君如艾怀仙骨，历尽风霜骨亦青。", source: "—— 瑞宫诗集" },
            { text: "采药归来山月高，艾香入梦魂亦销。", source: "—— 山中即事" },
            { text: "清明时节雨纷纷，艾草芬芳润如尘。", source: "—— 佚名《清明》" }
        ];

        function copy(text){ navigator.clipboard.writeText(text); alert('已复制色号: ' + text); }
        document.getElementById('color-grid').innerHTML = colors.map(c => `<div onclick="copy('${c.hex}')" class="cursor-pointer p-4 bg-white/60 rounded-xl border border-neutral-200/50 hover:border-[#4A6741]/50 transition"><div class="h-24 mb-3 rounded" style="background-color:${c.hex}"></div><p class="text-[11px] font-bold">${c.name}</p><p class="text-[10px] text-neutral-400 font-mono">${c.hex}</p></div>`).join('');
        document.getElementById('color-slider').oninput = function(){ const c=colors[this.value]; document.getElementById('dynamic-pad').style.backgroundColor=c.hex; document.getElementById('dynamic-name').innerText=c.name; document.getElementById('dynamic-hex').innerText=c.hex; };
        document.getElementById('next-poetry').onclick = () => { const p = poetries[Math.floor(Math.random()*poetries.length)]; document.getElementById('poetry-text').innerText = '“' + p.text + '”'; document.getElementById('poetry-source').innerText = p.source; };
    </script>
</body>
</html>
